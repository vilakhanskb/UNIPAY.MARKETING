<!doctype html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ບໍ່ພົບໜ້າ — UniPay Platform</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <main class="module-hero" style="min-height:100vh;display:grid;place-items:center;padding:60px 0">
    <section class="container" style="max-width:680px;text-align:center">
      <span class="brand-mark" style="margin:0 auto 24px"><i></i><i></i><i></i></span>
      <p class="eyebrow" style="justify-content:center"><span></span>404<span></span></p>
      <h1 style="font-size:clamp(2.5rem,8vw,5rem)">ບໍ່ພົບໜ້ານີ້</h1>
      <p class="lead">ລິ້ງອາດຖືກປ່ຽນ ຫຼືໜ້າທີ່ທ່ານຄົ້ນຫາຍັງບໍ່ພ້ອມ.</p>
      <a id="home-link" class="button button-primary" href="./">ກັບໜ້າຫຼັກ →</a>
    </section>
  </main>
  <script>
    const parts = window.location.pathname.split('/').filter(Boolean);
    const base = window.location.hostname.endsWith('github.io') && parts.length ? `/${parts[0]}/` : '/';
    document.getElementById('home-link').href = base;
  </script>
</body>
</html>
